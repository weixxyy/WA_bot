{% extends "base.html" %}
{% block title %}Расписание — WA Bot{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Расписание</h1><p>Часовой пояс определяется автоматически: {{ status.timezone }}.</p></div></div>
<section class="card">
  <form method="post" action="/schedule" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="switch"><input type="checkbox" name="schedule_enabled" {{ 'checked' if settings.schedule_enabled else '' }}> Рассылка по расписанию включена</label>
    <fieldset><legend>Дни недели</legend><div class="choices">
      {% for value, label in weekdays %}<label class="choice"><input type="checkbox" name="days" value="{{ value }}" {{ 'checked' if value in settings.schedule_days else '' }}> {{ label }}</label>{% endfor %}
    </div></fieldset>
    <label>Время запуска<textarea name="times" rows="3" placeholder="09:00&#10;18:00">{{ settings.schedule_times | join('\n') }}</textarea><small>По одному времени на строку или через пробел.</small></label>
    <div class="form-grid">
      <label>Минимальная пауза, сек<input type="number" min="0" step="0.5" name="delay_min" value="{{ settings.delay_min }}"></label>
      <label>Максимальная пауза, сек<input type="number" min="0" step="0.5" name="delay_max" value="{{ settings.delay_max }}"></label>
      <label>Лимит попыток за прогон<input type="number" min="1" name="max_attempts" value="{{ settings.max_attempts }}"></label>
    </div>
    <button class="primary">Сохранить расписание</button>
  </form>
</section>
{% endblock %}
