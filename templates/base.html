<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WA Bot{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">WA Bot</a>
    <nav>
      <a class="{{ 'active' if current_path == '/' else '' }}" href="/">Обзор</a>
      <a class="{{ 'active' if current_path.startswith('/message') else '' }}" href="/message">Сообщение</a>
      <a class="{{ 'active' if current_path.startswith('/schedule') else '' }}" href="/schedule">Расписание</a>
      <a class="{{ 'active' if current_path.startswith('/accounts') else '' }}" href="/accounts">Аккаунты</a>
      <a class="{{ 'active' if current_path.startswith('/groups') else '' }}" href="/groups">Группы</a>
      <a class="{{ 'active' if current_path.startswith('/history') else '' }}" href="/history">История</a>
      <a class="{{ 'active' if current_path.startswith('/logs') else '' }}" href="/logs">Журнал</a>
    </nav>
  </header>
  <main class="container">
    {% if flash_message %}<div class="flash success">{{ flash_message }}</div>{% endif %}
    {% if flash_error %}<div class="flash error">{{ flash_error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
